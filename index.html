<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صيدلية شفاء مصر | عروض منتجات العناية بالبشرة، الشعر والطفل</title>
    <meta name="description" content="تسوق أفضل منتجات العناية بالبشرة، العناية بالشعر، العناية بالأم والطفل مع صيدلية شفاء مصر." />
    <meta property="og:title" content="صيدلية شفاء مصر | Chefaa" />
    <meta property="og:description" content="عروض وخصومات صيدلية شفاء مصر على أفضل الماركات." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="page-wrapper">
      <!-- بانر نيفيا الترويجي -->
      <section class="promo-banner-wrapper" style="margin-top: 18px;">
        <img
          src="./assets/nivea_banner.webp"
          alt="نيفيا - بشرة ناعمة كل يوم - اطلب الآن"
          class="promo-banner-img"
          loading="eager"
        />
      </section>

      <!-- منتجات نيفيا -->
      <div class="section-header-row">
        <a href="#nivea-products" class="view-all-link">
          <span>عرض الكل</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>
      </div>
      <section class="products-grid" id="nivea-products"></section>

      <!-- منتجات العناية بالبشرة الأكثر مبيعًا -->
      <section style="margin-top: 55px;">
        <div class="section-header-row">
          <h2 class="section-main-title">
            <span>منتجات البشرة الأكثر مبيعًا</span>
            <span>💯</span>
          </h2>
          <a href="#all-skincare" class="btn-view-all-outlined">
            <span>عرض الكل</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </a>
        </div>
        <div class="carousel-wrapper">
          <button type="button" class="carousel-nav-btn prev" id="skincarePrevBtn" aria-label="السابق">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
          <button type="button" class="carousel-nav-btn next" id="skincareNextBtn" aria-label="التالي">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <div class="products-grid" id="skincare-grid"></div>
        </div>
      </section>

      <!-- بانر جريبكسون ومنتجاته -->
      <section style="margin-top: 55px;">
        <div class="promo-banner-wrapper">
          <img
            src="./assets/section3/grapexon_banner.webp"
            alt="جريبكسون - كل اللي محتاجه لرحلة خسارة الوزن"
            class="promo-banner-img"
            loading="lazy"
          />
        </div>
        <div class="section-header-row" style="margin-top: 20px;">
          <a href="#grapexon-products" class="view-all-link">
            <span>عرض الكل</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </a>
        </div>
        <div class="carousel-wrapper">
          <div class="grapexon-container-box">
            <button type="button" class="carousel-nav-btn prev" id="grapexonPrevBtn" aria-label="السابق">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
            <button type="button" class="carousel-nav-btn next" id="grapexonNextBtn" aria-label="التالي">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="products-grid" id="grapexon-grid"></div>
          </div>
        </div>
      </section>

      <!-- منتجات العناية للنساء -->
      <section style="margin-top: 55px;">
        <div class="section-header-row">
          <h2 class="section-main-title">
            <span>لها</span>
            <span>💄💅</span>
          </h2>
          <a href="#for-her" class="btn-view-all-outlined">
            <span>عرض الكل</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </a>
        </div>
        <div class="carousel-wrapper">
          <button type="button" class="carousel-nav-btn prev" id="forHerPrevBtn" aria-label="السابق">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
          <button type="button" class="carousel-nav-btn next" id="forHerNextBtn" aria-label="التالي">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <div class="products-grid" id="for-her-grid"></div>
        </div>
      </section>

      <!-- منتجات العناية بالشعر -->
      <section style="margin-top: 55px;">
        <div class="section-header-row">
          <h2 class="section-main-title">
            <span>أفضل منتجات العناية بالشعر</span>
            <span>💇</span>
          </h2>
          <a href="#hair-care" class="btn-view-all-outlined">
            <span>عرض الكل</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </a>
        </div>
        <div class="carousel-wrapper">
          <button type="button" class="carousel-nav-btn prev" id="haircarePrevBtn" aria-label="السابق">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
          <button type="button" class="carousel-nav-btn next" id="haircareNextBtn" aria-label="التالي">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <div class="products-grid" id="haircare-grid"></div>
        </div>
      </section>

      <!-- منتجات العناية بالطفل -->
      <section style="margin-top: 55px;">
        <div class="section-header-row">
          <h2 class="section-main-title">
            <span>كل ما يحتاجه طفلك</span>
            <span>🚼</span>
          </h2>
          <a href="#baby-care" class="btn-view-all-outlined">
            <span>عرض الكل</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </a>
        </div>
        <div class="carousel-wrapper">
          <button type="button" class="carousel-nav-btn prev" id="babyPrevBtn" aria-label="السابق">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
          <button type="button" class="carousel-nav-btn next" id="babyNextBtn" aria-label="التالي">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <div class="products-grid" id="baby-grid"></div>
        </div>
      </section>
    </div>
    <script type="module" src="./script.js"></script>
  </body>
</html>
